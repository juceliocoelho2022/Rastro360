<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Etiqueta QR Code | Rastro360</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#edf2f5;font-family:Arial,sans-serif;color:#172b3f}
    .toolbar{max-width:540px;margin:24px auto 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
    button{background:#067e65;color:white;border:0;padding:12px 18px;border-radius:8px;font-weight:bold;cursor:pointer}
    button:disabled{opacity:.5}
    .note{max-width:540px;margin:0 auto 12px;color:#556977;font-size:12px;line-height:1.5}
    .label{width:100mm;min-height:140mm;background:white;border:1px solid #d6e0e6;margin:0 auto 32px;padding:8mm;display:flex;flex-direction:column;align-items:center}
    .brand{font-size:24px;font-weight:800;align-self:start;margin-bottom:10px;color:#0c3542}
    .brand span{color:#08a37a}
    .heading{font-size:11px;color:#617482;letter-spacing:1.3px;align-self:start}
    .name{font-size:18px;font-weight:750;margin:7px 0 0;align-self:start;overflow-wrap:anywhere}
    .metadata{align-self:start;font-size:12px;color:#566b7a;margin-top:7px}
    .qr{width:76mm;height:76mm;object-fit:contain;image-rendering:pixelated;margin:8px auto}
    .code{font-family:Consolas,monospace;font-size:11px;letter-spacing:.1px;overflow-wrap:anywhere;text-align:center;font-weight:bold}
    .instruction{font-size:11px;color:#607483;text-align:center;margin-top:12px}
    .error{color:#a32636;max-width:540px;margin:auto}
    @page{size:100mm 150mm;margin:0}
    @media print{
      html,body{width:100mm;height:150mm;background:#fff;padding:0;margin:0}
      .toolbar,.note,.error{display:none!important}
      .label{width:100mm;min-height:150mm;border:0;margin:0;break-inside:avoid;box-shadow:none}
    }
    @media(max-width:420px){.label{max-width:100%;width:100%}.toolbar,.note{padding:0 12px}}
  </style>
</head>
<body>
  <div class="toolbar">
    <strong>Etiqueta do volume · Rastro360</strong>
    <button id="print" type="button" disabled>Imprimir etiqueta</button>
  </div>
  <p class="note">Formato 100 × 150 mm. Imprima em escala 100%, sem cabeçalho/rodapé. Cada QR aponta para a consulta pública do volume.</p>
  <p class="error" id="error" role="alert"></p>
  <div class="label" id="label">
    <div class="brand">Rastro<span>360</span></div>
    <div class="heading">IDENTIFICAÇÃO DO VOLUME</div>
    <div class="name" id="name">Carregando etiqueta...</div>
    <div class="metadata" id="meta"></div>
    <img class="qr" id="qr" alt="QR Code do código de rastreio">
    <div class="code" id="code"></div>
    <div class="instruction">Escaneie para acompanhar o rastreamento deste volume.</div>
  </div>
  <script>
    'use strict';
    const code = new URLSearchParams(location.search).get('code');
    const printButton = document.getElementById('print');
    const error = document.getElementById('error');
    printButton.addEventListener('click', () => window.print());
    async function loadLabel() {
      if (!code || !/^RT-[0-9A-F]{32}$/i.test(code)) throw Error('Código RT- inválido.');
      const response = await fetch('/api/units/' + encodeURIComponent(code), {credentials:'same-origin'});
      if (!response.ok) throw Error('Volume não encontrado ou acesso não autorizado.');
      const data = (await response.json()).unit;
      document.getElementById('name').textContent = data.productName;
      document.getElementById('meta').textContent =
        'SKU: ' + data.productSku + '  |  Lote: ' + data.lot + '  |  Quantidade: ' + data.quantity;
      document.getElementById('code').textContent = data.trackingCode;
      const qr = document.getElementById('qr');
      qr.onload = () => { printButton.disabled = false; };
      qr.onerror = () => { error.textContent = 'Falha ao carregar o QR Code.'; };
      qr.src = '/api/units/' + encodeURIComponent(data.trackingCode) + '/qr.png';
    }
    loadLabel().catch(e => {error.textContent = e.message; document.getElementById('name').textContent = 'Etiqueta indisponível';});
  </script>
</body>
</html>
