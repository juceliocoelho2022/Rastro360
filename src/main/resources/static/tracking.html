<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consultar entrega · Rastro360</title><link rel="stylesheet" href="/assets/style.css"></head>
<body style="min-height:100vh;padding:5vh 20px;background:#f4f7fa"><main style="max-width:650px;margin:0 auto"><header style="display:flex;align-items:center;gap:12px;margin-bottom:30px"><span class="brand-mark">R</span><div><h1 style="font-size:25px;margin:0">Rastro<span style="color:#008f6b">360</span></h1><div class="dim">Consulta de rastreamento</div></div></header><div class="panel"><div class="eyebrow">STATUS DE ENTREGA</div><div id="publicResult" class="empty">Consultando...</div></div><p class="dim" style="margin-top:18px">Esta página mostra somente dados de rastreamento. Informações internas e pessoais não são divulgadas.</p></main>
<script>
const safe = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => new Date(s).toLocaleString('pt-BR');
(async()=>{const code=new URLSearchParams(location.search).get('code');const out=document.getElementById('publicResult');if(!code){out.textContent='Informe um código válido no endereço da consulta.';return}try{const res=await fetch('/api/public/track/'+encodeURIComponent(code));if(!res.ok)throw Error('Código não encontrado. Verifique o identificador informado.');const data=await res.json();out.className='';out.innerHTML='<div class="trace-summary"><div><h2>'+safe(data.productName)+'</h2><div class="dim">'+safe(data.trackingCode)+' · Lote '+safe(data.lot)+' · '+data.quantity+' unidade(s)</div></div><span class="tag '+safe(data.status)+'">'+safe(data.status).replaceAll('_',' ')+'</span></div><div class="timeline">'+data.events.map(e=>'<div class="timeline-item"><strong>'+safe(e.description)+'</strong><time>'+fmt(e.occurredAt)+'</time></div>').join('')+'</div>'}catch(e){out.textContent=e.message}})();
</script></body></html>
